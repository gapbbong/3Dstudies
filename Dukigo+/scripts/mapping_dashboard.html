    <style>
        :root { --img-width: 1000px; }

        .explorer-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 4px; padding: 8px; overflow-y: auto; max-height: 200px; scrollbar-width: thin; }

        .explorer-label { font-size: 10px; font-weight: 500; color: #475569; word-break: break-all; }
        .tabs-filter { display: flex; padding: 10px; background: #fff; gap: 4px; border-bottom: 1px solid #f1f5f9; }
        .tab-f { flex: 1; padding: 6px; text-align: center; font-size: 11px; cursor: pointer; border-radius: 6px; background: #f8fafc; color: #64748b; border: 1px solid #e2e8f0; font-weight: 500; }
        .tab-f.active { background: #1e293b; color: white; border-color: #1e293b; }

        #controls { padding: 20px; border-top: 1px solid #e2e8f0; background: #f8fafc; }

        const rootNames = { scan: data.scan_root_name, data: data.data_root_name };
        let mapping = {};
        let currentSubjPath = '';
        let currentSubject = null;
        let currentDataPath = '';
        let currentDataFile = null;
        let currentFilter = 'all';
        let currentQId = null;

        function init() {
            renderExplorer('subj');
            renderExplorer('data');
            document.addEventListener('click', (e) => {
                if (!e.target.closest('#toolbar') && !e.target.closest('.crop-box')) document.getElementById('toolbar').style.display = 'none';
            });
        }

        function renderExplorer(type) {
            const isSubj = type === 'subj';
            const grid = document.getElementById(isSubj ? 'subj-grid' : 'data-grid');
            const breadcrumb = document.getElementById(isSubj ? 'subj-breadcrumb' : 'data-breadcrumb');
            const path = isSubj ? currentSubjPath : currentDataPath;
            
            grid.innerHTML = '';
            const rootLabel = isSubj ? "📂 PC: " + rootNames.scan : "📂 JSON: " + rootNames.data;
            breadcrumb.textContent = rootLabel + (path ? ' > ' + path.replace(/\//g, ' > ') : '');

            const folders = new Set();
            const files = [];

            if (isSubj) {
                data.scan_tree.forEach(item => {
                    if (path === '') {
                        if (item.type === 'folder' && item.path.split('/')[0] === item.path && item.path !== '') folders.add(item.path);
                        else if (item.type === 'pdf' && !item.path.includes('/')) files.push(item);
                    } else if (item.path.startsWith(path + '/')) {
                        const rel = item.path.substring(path.length + 1);
                        if (item.type === 'folder' && !rel.includes('/')) folders.add(rel);
                        else if (item.type === 'pdf' && !rel.includes('/')) files.push(item);
                    }
                });
            } else {
                if (!currentSubject) { grid.innerHTML = '<div style="padding:20px; font-size:11px; color:#94a3b8;">⬅️ 먼저 시험지 파일을 골라주세요!</div>'; return; }
                
                // Show subfolders in Step 2
                data.data_tree.forEach(item => {
                    if (path === '') {
                        if (item.path.split('/')[0] === item.path && item.path !== '') folders.add(item.path);
                    } else if (item.path.startsWith(path + '/')) {
                        const rel = item.path.substring(path.length + 1);
                        if (!rel.includes('/')) folders.add(rel);
                    }
                });
                
                // Show JSON files matched to subject
                data.files.filter(f => f.subject === currentSubject).forEach(f => {
                    if (path === '') { if (f.path === '') files.push(f); }
                    else if (f.path === path) { files.push(f); }
                });
            }

            if (path !== '') {
                const back = document.createElement('div');
                back.className = 'explorer-item';
                back.innerHTML = '<div class="icon">⬅️</div><div class="explorer-label">..</div>';
                back.onclick = () => {
                    const parts = path.split('/'); parts.pop();
                    if (isSubj) currentSubjPath = parts.join('/'); else currentDataPath = parts.join('/');
                    renderExplorer(type);
                };
                grid.appendChild(back);
            }

            Array.from(folders).sort().forEach(folder => {
                const item = document.createElement('div');
                const fullPath = path ? path + '/' + folder : folder;
                item.className = 'explorer-item' + (isSubj && fullPath === currentSubject ? ' active' : '');
                item.innerHTML = '<div class="icon">📂</div><div class="explorer-label">' + folder + '</div>';
                item.onclick = () => {
                    if (isSubj) {
                        currentSubjPath = fullPath;
                        if (data.scan_tree.find(f => f.path === fullPath && f.has_images)) {
                            currentSubject = fullPath; renderPages(); renderExplorer('data');
                        }
                        renderExplorer('subj');
                    } else { currentDataPath = fullPath; renderExplorer('data'); }
                };
                grid.appendChild(item);
            });

            files.forEach(f => {
                const item = document.createElement('div');
                const isSubjFile = f.type === 'pdf';
                item.className = 'explorer-item' + ((isSubjFile ? f.path : f.key) === (isSubjFile ? currentSubject : currentDataFile) ? ' active' : '');
                item.innerHTML = `<div class="icon">${isSubjFile ? '📕' : '📄'}</div><div class="explorer-label">` + (isSubjFile ? f.name : f.display) + '</div>';
                item.onclick = () => {
                    if (isSubjFile) {
                        currentSubject = f.path;
                        renderPages();
                        renderExplorer('subj');
                        renderExplorer('data');
                    } else {
                        currentDataFile = f.key;
                        renderExplorer('data');
                        renderList();
                    }
                };
                grid.appendChild(item);
            });
        }

        function renderList() {
            const list = document.getElementById('q-list');
            list.innerHTML = '';
            if (!currentDataFile) return;
            data.questions[currentDataFile].forEach(q => {
                const isMapped = (mapping[q.id] || []).length > 0;
                if (currentFilter === 'suggested' && !q.suggested) return;
                if (currentFilter === 'mapped' && !isMapped) return;
                const div = document.createElement('div');
                div.className = 'q-item' + (isMapped ? ' done' : '') + (q.suggested ? ' suggested' : '') + (q.id === currentQId ? ' active' : '');
                div.innerHTML = `<div class="badge">${q.num}번 문제</div><div>${q.question.substring(0, 75)}...</div>`;
                div.onclick = () => { currentQId = q.id; document.querySelectorAll('.q-item').forEach(i => i.classList.remove('active')); div.classList.add('active'); };
                list.appendChild(div);
            });
        }

        function renderPages() {
            const container = document.getElementById('page-list'); container.innerHTML = '';
            if (!currentSubject) return;
            const images = data.images[currentSubject] || [];
            images.forEach(img => {
                const cropsHtml = (data.crops[currentSubject][img.part] || []).map((c, i) => `
                    <div class="crop-box" id="crop-${img.part}-${i}" 
                         style="left:${(c.x/img.width)*100}%; top:${(c.y/img.height)*100}%; width:${(c.w/img.width)*100}%; height:${(c.h/img.height)*100}%;"
                         onclick="handleCropClick(event, ${img.part}, ${i})">
                        <div class="crop-num">#${i+1}</div><div class="target-label" id="label-${img.part}-${i}"></div>
                    </div>
                `).join('');
                container.innerHTML += `<div class="page-container"><div class="page-header">📌 ${currentSubject} - 파트 ${img.part}</div><div class="img-wrapper"><img src="../public/images/temp/${img.filename}" class="page-img">${cropsHtml}</div></div>`;
            });
            container.scrollTop = 0;
        }

        function updateZoom(v) { document.documentElement.style.setProperty('--img-width', v + 'px'); }
        function changeZoom(d) { const s = document.getElementById('zoom-slider'); s.value = parseInt(s.value) + d; updateZoom(s.value); }
        function handleCropClick(e, p, i) {
            if (!currentQId) return alert('먼저 문제를 골라주세요!');
            pendingMapping = { part: p, index: i, crop: data.crops[currentSubject][p][i] };
            const t = document.getElementById('toolbar'); t.style.display = 'flex'; t.style.left = e.pageX + 'px'; t.style.top = e.pageY + 'px';
        }
        function applyTarget(t) {
            if (!mapping[currentQId]) mapping[currentQId] = [];
            mapping[currentQId].push({ ...pendingMapping, target: t });
            const box = document.getElementById(`crop-${pendingMapping.part}-${pendingMapping.index}`);
            box.classList.add('selected');
            document.getElementById(`label-${pendingMapping.part}-${pendingMapping.index}`).textContent = t;
            document.getElementById('toolbar').style.display = 'none';
        }
        function exportAndCopy() { const result = { subject: currentSubject, mapping: mapping }; navigator.clipboard.writeText(JSON.stringify(result, null, 2)).then(() => alert('복사되었습니다!')); }
        function filterList(f) { currentFilter = f; renderList(); }
        init();
    </script>
</body>
</html>
